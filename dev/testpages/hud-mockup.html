<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>HUD mockup — WebGUI test</title>
<style>
  /* Transparent: this is drawn over the world, so no background of its own. */
  html, body { margin: 0; background: transparent; font: 14px/1.4 system-ui, "Malgun Gothic", sans-serif; }

  .hud-top {
    position: fixed; top: 0; left: 0;
    width: 570px;
    background: #fbe3c8;
    border-radius: 0 0 22px 0;
    padding: 8px 12px 0;
    color: #4a3a2a;
    box-shadow: 0 2px 6px rgba(0, 0, 0, .25);
  }
  .row { display: flex; align-items: center; }
  .money { height: 52px; }
  .cell { display: flex; align-items: center; gap: 8px; flex: 1; }
  .cell + .cell { border-left: 2px dotted #d8b896; padding-left: 16px; }
  .coin { width: 38px; height: 38px; border-radius: 50%; background: radial-gradient(#ffe27a, #e8a317); border: 3px solid #c98a10; flex: none; }
  .scroll { width: 38px; height: 38px; border-radius: 8px; background: #e9c48a; border: 3px solid #b98b52; flex: none; }
  .label { font-size: 12px; color: #6b5a48; }
  .value { font-size: 22px; font-weight: 700; letter-spacing: .5px; }
  .value small { font-size: 11px; font-weight: 600; color: #8a7760; margin-left: 2px; }

  .stats {
    margin: 4px -12px 0;
    padding: 6px 12px;
    background: #dfe9c5;
    border-radius: 0 0 22px 0;
    height: 34px;
  }
  .stat { display: flex; align-items: center; gap: 6px; font-size: 13px; padding: 0 12px; flex: none; }
  .stat + .stat { border-left: 2px dotted #b9c79a; }
  .stat b { font-size: 15px; }
  .icon { width: 20px; height: 20px; border-radius: 5px; flex: none; }
  .i-heart { background: #e86a7a; }
  .i-shield { background: #6aa8c9; }
  .i-home { background: #9a7b4f; }

  .clock {
    position: fixed; top: 100px; left: 10px;
    font: 700 22px/1 ui-monospace, "SF Mono", monospace;
    color: #fff; text-shadow: 0 0 3px #000, 0 0 3px #000;
  }
  .clock small { font-size: 11px; margin-left: 3px; opacity: .8; }
</style>
</head>
<body>
  <div class="hud-top">
    <div class="row money">
      <div class="cell">
        <div class="coin"></div>
        <div><div class="label">보유머니</div><div class="value">336,954,768<small>골드</small></div></div>
      </div>
      <div class="cell">
        <div class="scroll"></div>
        <div><div class="label">빚</div><div class="value">3,045,450,000<small>골드</small></div></div>
      </div>
    </div>
    <div class="row stats">
      <div class="stat"><span class="icon i-heart"></span>후원코인 <b>4,350</b> 개</div>
      <div class="stat"><span class="icon i-shield"></span>신용 <b>999점</b> · 1등급</div>
      <div class="stat"><span class="icon i-home"></span><b>사냥터 - 2채널</b></div>
    </div>
  </div>
  <div class="clock">04:24:51<small>KST</small></div>
</body>
</html>
